<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Life OS: turn ambitions into objectives, objectives into systems, and systems into measurable daily progress." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life OS" />
    <title>Life OS</title>
    <script>
      // Pick the theme before first paint to avoid a flash.
      (function () { try { var d = matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = d ? 'dark' : 'light'; } catch (e) {} })();
    </script>
    <style>
      html, body { margin: 0; background: #f6f6f7; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0b0b0e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Life OS needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
